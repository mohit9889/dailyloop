name: Validate DailyLoop
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build -w @dailyloop/contracts
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:postgres -w @dailyloop/backend
      - run: npm run build
# Native bundles/device builds are release checks for now, preserving free CI allowance.
# No deployment, billable runner or paid service activation is performed by this workflow.
